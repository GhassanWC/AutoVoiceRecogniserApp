name: live_translator
description: Real-time automatic surrounding-language translator.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  web_socket_channel: ^3.0.1
  uuid: ^4.4.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_app_check: ^0.4.8
  cloud_functions: ^6.5.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^4.2.0
  # App-icon pipeline: `image` powers tool/generate_app_icons.dart, which
  # derives the icon layers from ONE source file; flutter_launcher_icons then
  # writes every platform size. See tool/generate_app_icons.dart.
  image: ^4.2.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Launcher icons. To change the icon, replace
# assets/branding/app_icon_source.png and run:
#   dart run tool/generate_app_icons.dart
# (that rebuilds the layers below, then invokes flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  # iOS: square, full-bleed, no alpha (Apple rejects transparent app icons and
  # applies its own corner mask).
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#1560FF"
  # Android: legacy bitmap icon plus a true adaptive icon (separate backdrop
  # and mark layers so launcher masking/parallax behave correctly).
  android: "ic_launcher"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
