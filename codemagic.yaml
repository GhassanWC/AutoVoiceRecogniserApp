workflows:
  ios-testflight:
    name: Live Translator iOS TestFlight
    working_directory: mobile
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - code-signing

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Initialize signing keychain
        script: |
          keychain initialize

      - name: Fetch Apple signing files
        script: |
          app-store-connect fetch-signing-files \
            "com.ghassanalhattali.livetranslator" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificate
        script: |
          keychain add-certificates

      - name: Configure Xcode signing
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Flutter tests
        script: |
          flutter test

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=6 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration