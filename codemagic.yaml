workflows:
  ios-testflight:
    name: Live Translator iOS TestFlight
    working_directory: mobile
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - code-signing
        # firebase-config must define (as SECURE variables):
        #   GOOGLE_SERVICE_INFO_PLIST_B64 — base64 of the iOS
        #   GoogleService-Info.plist produced by `flutterfire configure`
        #   (locally: `base64 -i ios/Runner/GoogleService-Info.plist`).
        #   GOOGLE_SERVER_CLIENT_ID — the OAuth *web* client ID
        #   (xxx.apps.googleusercontent.com), passed to the app as a
        #   dart-define for Google Sign-In on Android.

      vars:
        # App Store Connect → App Information → Apple ID
        APP_STORE_APPLE_ID: "6808526994"

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Restore Firebase iOS config
        script: |
          #!/bin/bash
          set -e
          # working_directory is `mobile`, so the plist path is relative to it.
          python3 - <<'PY'
          import os, base64, pathlib
          p = pathlib.Path("ios/Runner/GoogleService-Info.plist")
          p.write_bytes(base64.b64decode(os.environ["GOOGLE_SERVICE_INFO_PLIST_B64"]))
          print("Firebase plist restored")
          PY
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: |
          # Flutter plugins (including the Firebase SDKs) integrate via
          # CocoaPods — the committed ios/Podfile. No bundled ML assets:
          # speech recognition, language detection and translation all run
          # in Gemini Live Translate via an ephemeral-token WebSocket.
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Initialize signing keychain
        script: |
          keychain initialize

      - name: Fetch Apple signing files
        script: |
          app-store-connect fetch-signing-files \
            "com.ghassanalhattali.livetranslator" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificate
        script: |
          keychain add-certificates

      - name: Configure Xcode signing
        script: |
          # Export options are derived from the IOS_APP_STORE profile fetched
          # above, so the archive exports for App Store distribution.
          #
          # NOTHING here may set testFlightInternalTestingOnly: that flag marks
          # the upload as internal testing only, and App Store Connect then
          # refuses to attach the build to a version for review.
          xcode-project use-profiles

      - name: Verify the export is App Store eligible (build gate)
        script: |
          #!/bin/bash
          set -e

          PLIST=/Users/builder/export_options.plist
          echo "[EXPORT GATE] generated export options:"
          plutil -p "$PLIST"

          if plutil -extract testFlightInternalTestingOnly raw "$PLIST" \
              >/dev/null 2>&1; then
            echo "[EXPORT GATE] FAILED — testFlightInternalTestingOnly is set."
            echo "              This build could not be submitted for review."
            exit 1
          fi

          METHOD=$(plutil -extract method raw "$PLIST")
          case "$METHOD" in
            app-store|app-store-connect)
              echo "[EXPORT GATE] PASSED — method=$METHOD, no internal-testing restriction."
              ;;
            *)
              echo "[EXPORT GATE] FAILED — export method is '$METHOD', not App Store."
              exit 1
              ;;
          esac

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Flutter tests
        script: |
          flutter test

      - name: Cloud Functions typecheck + tests
        script: |
          #!/bin/bash
          set -e
          cd ../functions
          npm ci
          npm run typecheck
          npm test

      # -------------------------------------------------------------
      # AUTOMATIC TESTFLIGHT BUILD NUMBER
      #
      # Public version stays 1.0.0.
      # Build number automatically becomes:
      # 22 → 23 → 24 → 25 → ...
      # -------------------------------------------------------------
      - name: Get next TestFlight build number
        script: |
          #!/bin/bash
          set -e

          echo "Getting latest TestFlight build number..."

          LATEST_BUILD_NUMBER=$(app-store-connect \
            get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID")

          echo "Latest TestFlight build: $LATEST_BUILD_NUMBER"

          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Next build number: $BUILD_NUMBER"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      - name: Build iOS IPA
        script: |
          #!/bin/bash
          set -e

          echo "========================================"
          echo "Building Sayvo"
          echo "Version: 1.0.0"
          echo "Build: $BUILD_NUMBER"
          echo "========================================"

          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Verify NO legacy ML models ship in the IPA (build gate)
        script: |
          #!/bin/bash
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA" ]; then
            echo "[BUNDLE GATE] ERROR: no .ipa under build/ios/ipa"
            exit 1
          fi

          UNPACK=$(mktemp -d)
          unzip -q "$IPA" -d "$UNPACK"

          LEFTOVERS=$(find "$UNPACK/Payload" \
            \( -iname "*.mlmodelc" -o -iname "*.mlmodel" -o -iname "*.mlpackage" \
               -o -iname "*ggml*" -o -iname "*whisper*" -o -iname "*voxlingua*" \
               -o -iname "LanguageID" \) | head -n 5)

          rm -rf "$UNPACK"

          if [ -n "$LEFTOVERS" ]; then
            echo "[BUNDLE GATE] FAILED — legacy ML artifacts found in IPA:"
            echo "$LEFTOVERS"
            exit 1
          fi

          echo "[BUNDLE GATE] PASSED — no local speech/language models in this IPA."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
